# Rate-limit zones — `http` context.
#
# Installed by the deploy (root, from the committed git blob read out of root's
# own mirror) as /etc/nginx/conf.d/wp-limits.conf, BEFORE the vhost: nginx
# refuses a vhost that names an unknown zone (`nginx -t`). A zone cannot be
# declared inside a `server` block, hence this separate file.
#
# `wp_login` guards /accounts/login/, /admin/login/ and /admin/2fa/ (plain Django
# views, no lockout in the app besides django-otp's per-device delay). 10r/m per
# IP: far above human use, far below what a password- or code-guessing run needs
# (same model as tm-limits.conf / poker-limits.conf).
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=10r/m;
