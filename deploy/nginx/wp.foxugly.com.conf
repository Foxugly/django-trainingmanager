# TrainingManager — nginx reverse proxy to Gunicorn (127.0.0.1:8003).
# wp.foxugly.com is covered by the existing *.foxugly.com wildcard cert
# (/etc/letsencrypt/live/foxugly.com/) — no per-subdomain certbot run needed.
#
# Installed to /etc/nginx/sites-available/wp.foxugly.com and symlinked into
# sites-enabled by deploy/setup-server.sh. The box-wide 00-default-deny drops
# unknown-Host scans (OPERATIONS.md §3.6) — nothing to add here.
# /health/ is proxied through `location /` to the Django health view (§3.9).

server {
    listen 443 ssl;
    server_name wp.foxugly.com;

    access_log /var/log/nginx/wp.foxugly.com.access.log;
    error_log /var/log/nginx/wp.foxugly.com.error.log;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/django_websites/old/django_trainingmanager/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/django_websites/old/django_trainingmanager/media/;
        access_log off;
        expires 30d;
    }

    location / {
        # Upstream is the Gunicorn bind from the systemd unit (127.0.0.1:8003).
        # Keep in sync with trainingmanager-gunicorn.service — mismatch => 502.
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    ssl_certificate /etc/letsencrypt/live/foxugly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxugly.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name wp.foxugly.com;
    return 301 https://$host$request_uri;
}
