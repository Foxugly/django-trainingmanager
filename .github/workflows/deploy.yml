name: Test & Deploy

on:
  push:
    branches: [main]
  # Sans ce declencheur, une PR n'etait verifiee par RIEN : la suite ne tournait
  # qu'apres le merge, sur la branche qui deploie. Constate le 2026-07-30 --
  # plusieurs PR Dependabot ouvertes sur ce depot n'avaient aucun check.
  # Seul `test` tourne ici ; `deploy` reste garde par son `if`.
  pull_request:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite alors que la production tourne sur
    # PostgreSQL 16 (DB_ENGINE=postgresql sur la box, via SSM). SQLite est plus
    # permissif et laisse passer des requetes que PostgreSQL refuse — c'est
    # ainsi que deux endpoints casses ont vecu en production sur QuizOnline
    # sans qu'aucun test ne les voie. On teste donc sur le moteur de production.
    env:
      # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.13).
      # Au niveau du job : `check` / `makemigrations --check` et les tests
      # doivent voir le meme moteur que la production.
      DB_ENGINE: postgresql
      DB_NAME: trainingmanager
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=trainingmanager \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # matches the box venv

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks (config + migration drift)
        env:
          STATE: TEST
          SECRET_KEY: test-secret-key
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          STATE: TEST
          SECRET_KEY: test-secret-key
        run: python manage.py test --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write    # mint the OIDC token to assume the deploy role
      contents: read

    steps:
      # OIDC -> SSM (no long-lived SSH key). AWS-RunShellScript runs as root and
      # invokes deploy.sh as django (git reset, pip, sqlite backup, migrate,
      # collectstatic, perms, restart via the trainingmanager-deploy sudoers
      # grant). Secrets stay in SSM (/trainingmanager/prod/*), fetched to
      # /run/trainingmanager/.env at boot by trainingmanager-env-fetch.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Reset the tree FIRST (picks up a changed deploy.sh this run), THEN
          # run it — otherwise a deploy.sh that resets itself needs two deploys.
          cat > /tmp/ssm-params.json <<'EOF'
          { "commands": [
            "sudo -u django bash -c 'umask 027; cd /var/www/django_websites/old/django_trainingmanager && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "sudo -u django bash /var/www/django_websites/old/django_trainingmanager/deploy/deploy.sh"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy trainingmanager ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command after 15 minutes"
          exit 1

  # Audit des dépendances Python contre la base d'avis PyPI (OSV) : le job échoue
  # sur toute vulnérabilité connue. pip-audit résout l'arbre complet, dépendances
  # transitives comprises, dans un venv jetable ; outil épinglé, cache pip.
  # Exceptions : .pip-audit-ignore, une ligne « ID AAAA-MM-JJ # raison » ;
  # une exception expirée fait échouer le job — à réexaminer, pas à oublier.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit (version figée)
        run: python -m pip install pip-audit==2.10.1

      - name: Audit des dépendances
        run: |
          ignore=()
          if [ -f .pip-audit-ignore ]; then
            today=$(date -u +%F)
            while read -r id expiry _ || [ -n "$id" ]; do
              case "$id" in ''|'#'*) continue ;; esac
              if [[ ! "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::.pip-audit-ignore : date d'expiration manquante pour $id"; exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "::error::.pip-audit-ignore : l'exception $id a expiré le $expiry"; exit 1
              fi
              ignore+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          pip-audit --progress-spinner off -r requirements.txt "${ignore[@]}"
