{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">{% trans "Delete" %}</h3>
                </div>
                <div class="card-body">
                    <p>{% blocktrans with obj=object %}Are you sure you want to delete <strong>{{ obj }}</strong>?{% endblocktrans %}</p>
                    <form method="post" action="">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" href="{% if request.GET.next %}{{ request.GET.next }}{% else %}/{% endif %}">{% trans "Cancel" %}</a>
                            <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
