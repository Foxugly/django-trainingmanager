[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*/migrations/*",
    ".venv/*",
    "venv/*",
    "tests/factories.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long (let formatters handle it)
    "E741",  # ambiguous variable name (legacy single-letter vars)
]

[tool.ruff.lint.per-file-ignores]
"django-trainingmanager/settings/*.py" = ["F403", "F405"]  # star imports are idiomatic in Django settings split


[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
    /migrations/
  | /\.venv/
  | /venv/
)
'''
