[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*/migrations/*",
    ".venv/*",
    "venv/*",
    "tests/factories.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (let formatters handle it)
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
    /migrations/
  | /\.venv/
  | /venv/
)
'''
